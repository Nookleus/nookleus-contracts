[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.26"
evm_version = "cancun"
auto_detect_remappings = false
remappings = [
    "v4-core/=lib/v4-core/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "permit2/=lib/permit2/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
via_ir = true
optimizer = true
optimizer_runs = 1000
bytecode_hash = "none"
